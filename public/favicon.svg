<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2c6" />
      <stop offset="35%" stop-color="#f0e6d2" />
      <stop offset="70%" stop-color="#c8aa6e" />
      <stop offset="100%" stop-color="#785a28" />
    </linearGradient>
    <linearGradient id="crystalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="80%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="arcaneGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Dark Ring Base -->
  <circle cx="32" cy="32" r="30" fill="#091428" stroke="url(#goldGrad)" stroke-width="2.5" />
  <circle cx="32" cy="32" r="26" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="2 3" opacity="0.6" />

  <!-- 4 Cardinal Diamonds on the Ring -->
  <polygon points="32,3 35,6 32,9 29,6" fill="url(#crystalGrad)" stroke="url(#goldGrad)" stroke-width="0.8" />
  <polygon points="32,55 35,58 32,61 29,58" fill="url(#crystalGrad)" stroke="url(#goldGrad)" stroke-width="0.8" />
  <polygon points="3,32 6,35 9,32 6,29" fill="url(#crystalGrad)" stroke="url(#goldGrad)" stroke-width="0.8" />
  <polygon points="55,32 58,35 61,32 58,29" fill="url(#crystalGrad)" stroke="url(#goldGrad)" stroke-width="0.8" />

  <!-- Arcane Glowing Energy Burst in Center -->
  <circle cx="32" cy="32" r="14" fill="url(#crystalGrad)" opacity="0.3" filter="url(#arcaneGlow)" />

  <!-- Stylized League 'L' Monogram Body -->
  <!-- Vertical Bar of the 'L' with Serifs -->
  <path d="M19 14 L29 14 L27 42 L48 42 L48 50 L19 50 Z" fill="url(#crystalGrad)" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linejoin="round" filter="url(#arcaneGlow)" />

  <!-- Inner Diamond Accents on 'L' -->
  <polygon points="23,17 26,20 23,32 21,29" fill="#e0f2fe" opacity="0.85" />
  <polygon points="27,45 44,45 41,48 24,48" fill="#e0f2fe" opacity="0.85" />

  <!-- Center Hextech Sparkle Core -->
  <circle cx="32" cy="32" r="3" fill="#ffffff" filter="url(#arcaneGlow)" />
</svg>